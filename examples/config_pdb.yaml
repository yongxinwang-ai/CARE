data:
  train_files: hiyouga/geometry3k@train
  val_files: hiyouga/geometry3k@test
  prompt_key: problem
  answer_key: answer
  image_key: images
  video_key: videos
  image_dir: null
  video_fps: 2.0
  max_prompt_length: 2048
  max_response_length: 2048
  rollout_batch_size: 256
  mini_rollout_batch_size: null
  val_batch_size: 1024
  format_prompt: ./examples/format_prompt/math.jinja
  override_chat_template: null
  shuffle: true
  seed: 1
  min_pixels: 262144
  max_pixels: 4194304
  filter_overlong_prompts: true

algorithm:
  adv_estimator: grpo
  disable_kl: false
  use_kl_loss: true
  kl_penalty: low_var_kl
  kl_coef: 1.0e-2
  online_filtering: false
  filter_key: overall
  filter_low: 0.01
  filter_high: 0.99
  
  # PDB variant configuration
  grpo_variant: pdb
  
  # PDB (Primal-Dual Budgeter) configuration
  pdb_config:
    # Budget constraints
    visual_budget: 512      # Maximum visual tokens equivalent
    text_budget: 160        # Maximum text tokens
    
    # Dual variables (Lagrangian multipliers)
    lambda_v_init: 0.02     # Initial visual cost multiplier
    lambda_t_init: 0.01     # Initial text cost multiplier
    lambda_v_lr: 0.001      # Learning rate for visual dual variable
    lambda_t_lr: 0.001      # Learning rate for text dual variable
    
    # Action costs (in token-equivalent units)
    cost_per_text_token: 1  # Cost per text token
    
    # Stopping threshold
    stopping_threshold: 0.0 # Stop when max(gain - cost) <= threshold
    
    # SLA mode
    sla_mode: "normal"      # Options: "strict", "normal", "relaxed"
    sla_presets:
      strict:
        visual_budget: 256
        text_budget: 80
        lambda_v_init: 0.04
        lambda_t_init: 0.02
      normal:
        visual_budget: 512
        text_budget: 160
        lambda_v_init: 0.02
        lambda_t_init: 0.01
      relaxed:
        visual_budget: 1024
        text_budget: 320
        lambda_v_init: 0.01
        lambda_t_init: 0.005

worker:
  actor:
    global_batch_size: 128
    micro_batch_size_per_device_for_update: 4
    micro_batch_size_per_device_for_experience: 16
    max_grad_norm: 1.0
    padding_free: true
    dynamic_batching: true
    ulysses_size: 1
    model:
      model_path: Qwen/Qwen2.5-VL-3B-Instruct
      enable_gradient_checkpointing: true
      trust_remote_code: true
      freeze_vision_tower: false
    optim:
      lr: 1.0e-6
      weight_decay: 1.0e-2
      strategy: adamw
      lr_warmup_ratio: 0.0
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
    offload:
      offload_params: true
      offload_optimizer: true

  rollout:
    n: 4
    temperature: 1.0
    top_p: 1.0
    limit_images: 0
    gpu_memory_utilization: 0.6
    enforce_eager: false
    enable_chunked_prefill: false
    tensor_parallel_size: 1
    disable_tqdm: false
    val_override_config:
      temperature: 1.0
      n: 1

  ref:
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: true
      enable_rank0_init: true
    offload:
      offload_params: false

  reward:
    reward_type: batch
    reward_function: ./examples/reward_function/math.py:compute_score

trainer:
  total_epochs: 10
  max_steps: null
  project_name: easy_r1
  experiment_name: qwen2_5_vl_3b_geo3k_pdb_grpo
  logger: ["console", "wandb"]
  nnodes: 1
  n_gpus_per_node: 2
  max_try_make_batch: 20
  val_freq: 5
  val_before_train: true
  val_only: false
  val_generations_to_log: 3
  save_freq: 5
  save_limit: 3
  save_model_only: false
  save_checkpoint_path: null
  load_checkpoint_path: null