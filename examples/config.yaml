data:
  train_files: hiyouga/math12k@train
  val_files: hiyouga/math12k@test
  prompt_key: problem
  answer_key: answer
  image_key: images
  video_key: videos
  image_dir: null
  video_fps: 2.0
  max_prompt_length: 2048
  max_response_length: 2048
  rollout_batch_size: 512  # equivalent to verl's data.train_batch_size
  mini_rollout_batch_size: null  # equivalent to verl's data.gen_batch_size
  val_batch_size: 1024
  format_prompt: ./examples/format_prompt/math.jinja
  override_chat_template: null
  shuffle: true
  seed: 1
  min_pixels: 262144
  max_pixels: 4194304
  filter_overlong_prompts: true

algorithm:
  adv_estimator: grpo
  disable_kl: false
  use_kl_loss: true
  kl_penalty: low_var_kl
  kl_coef: 1.0e-2
  online_filtering: false  # dapo filter groups
  filter_key: overall
  filter_low: 0.01
  filter_high: 0.99
  
  # GRPO variant configuration
  grpo_variant: standard  # Options: "standard", "pge", "cgsg", "care"
  
  # PGE (Perturbed Golden Ensemble) configuration
  pge_config:
    num_perturbations: 4  # Number of perturbed variants (N)
    perturbation_methods: ["token_substitute", "token_delete", "token_insert"]
    perturbation_strength: 0.1  # Probability of applying perturbation
    
  # CGSG (Contrastive Golden Sample Group) configuration  
  cgsg_config:
    num_negatives: 4  # Number of hard negatives to select
    negative_selection_strategy: "lowest_reward"  # Options: "lowest_reward", "max_diversity"
    loss_type: "normalized_advantage"  # Options: "normalized_advantage", "contrastive_loss"

# CARE configuration
care:
  K: 4
  M: 6
  neg_scale_s: 0.5
  eps: 1.0e-6
  equalize: true
  rescue:
    enable: true
    delta: 0.1
  token_weighting: region_weighted
  gamma_pos: 0.005
  instrument:
    enable: false
    care_jsonl: null
    rgr_jsonl: null

# RGR (Reflection-Guided Resampling) configuration
rgr:
  enable: true
  template: structured
  max_critique_tokens: 64
  s_refl: null
  sampling:
    temperature: 0.6
    top_p: 0.95
    max_tokens: 512

worker:
  actor:
    global_batch_size: 128  # equivalent to verl's actor.ppo_mini_batch_size
    micro_batch_size_per_device_for_update: 4  # equivalent to verl's actor.ppo_micro_batch_size_per_gpu
    micro_batch_size_per_device_for_experience: 16  # equivalent to verl's rollout.log_prob_micro_batch_size_per_gpu
    max_grad_norm: 1.0
    padding_free: true
    dynamic_batching: true
    ulysses_size: 1
    model:
      model_path: Qwen/Qwen2.5-7B-Instruct
      enable_gradient_checkpointing: true
      trust_remote_code: false
      freeze_vision_tower: false
    optim:
      lr: 1.0e-6
      weight_decay: 1.0e-2
      strategy: adamw  # {adamw, adamw_bf16}
      lr_warmup_ratio: 0.0
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
    offload:
      offload_params: true  # true: more CPU memory; false: more GPU memory
      offload_optimizer: true  # true: more CPU memory; false: more GPU memory

  rollout:
    n: 8
    temperature: 1.0
    top_p: 1.0
    limit_images: 0
    gpu_memory_utilization: 0.6
    enforce_eager: false
    enable_chunked_prefill: false
    tensor_parallel_size: 2
    disable_tqdm: false
    val_override_config:
      temperature: 1.0
      n: 1

  ref:
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: true  # true: more CPU memory; false: more GPU memory
      enable_rank0_init: true
    offload:
      offload_params: false

  reward:
    reward_type: batch
    reward_function: ./examples/reward_function/math.py:compute_score

trainer:
  total_epochs: 15
  max_steps: null
  project_name: easy_r1
  experiment_name: qwen2_5_7b_math_grpo
  logger: ["console", "wandb"]
  nnodes: 1
  n_gpus_per_node: 8
  max_try_make_batch: 20  # -1 means no limit
  val_freq: 5  # -1 to disable
  val_before_train: true
  val_only: false
  val_generations_to_log: 3
  save_freq: 5  # -1 to disable
  save_limit: 3  # -1 to disable
  save_model_only: false
  save_checkpoint_path: null
  load_checkpoint_path: null

# Reflex (1P1N-Reflex) configuration
reflex:
  enable: false  # Enable 1P1N-Reflex hook (disable by default)
  m: 1  # Number of resamples per negative sample
  use_pos_as_hint: false  # Use positive sample as hint in critique
  from_negative: true  # Generate from negative sample (true) vs from scratch (false)
  template: default  # Reflection template: "default", "free", "structured"
  hint_mode: final_answer  # How to extract hint from positive sample
  max_critique_tokens: 64  # Max tokens for critique generation

  # Sampling parameters for reflex generation
  sampling:
    temperature: 0.6
    top_p: 0.95
    max_tokens: 512

  # Instrumentation (event logging)
  instrument:
    enable: false  # Enable event logging (disable by default)
    log_jsonl: null  # Path to JSONL log file (set via command line)
    add_canary: false  # Add canary tokens to detect hint leakage
    canary_token: "<HINT_CANARY>"  # Canary token string
    log_problem_text: false  # Include full problem text in events
    log_negative_answer: false  # Include negative answer text in events
